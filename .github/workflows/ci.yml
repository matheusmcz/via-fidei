name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

# Os secrets do Supabase (só a URL e a chave pública, nunca a service_role)
# entram apenas nos jobs que leem o banco: supabase-env, build e e2e.
# O job `quality` roda sem eles, para que nenhum teste unitário ou de
# integração consiga acessar o Supabase real.

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        run: npm run test:integration

  supabase-env:
    name: Secrets do Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Conferir secrets
        run: |
          missing=()
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Secrets do Supabase ausentes::Faltam: ${missing[*]}. Crie em Settings → Secrets and variables → Actions → Repository secrets, com a URL do projeto e a chave pública (publishable). Nunca use a service_role. PRs vindos de fork não recebem secrets. Depois de criar, rode o workflow de novo (Re-run jobs)."
            exit 1
          fi
          echo "Secrets do Supabase presentes."

  build:
    name: Build
    needs: supabase-env
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Reaproveitado pelo job de e2e (sem o cache do Next, que é grande).
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (Playwright, Chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache dos browsers do Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências do sistema
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes e2e
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
